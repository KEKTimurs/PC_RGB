name: Build RGBWave.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade openrgb-python pystray pillow pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name RGBWave rgb_wave.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force RGBWave | Out-Null
          Copy-Item dist\RGBWave.exe, config.json, README.md RGBWave\
          Compress-Archive -Path RGBWave\* -DestinationPath RGBWave.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RGBWave
          path: RGBWave/

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RGBWave.zip --title "RGBWave (последняя сборка)" --notes "Скачайте RGBWave.zip, распакуйте и следуйте README."
